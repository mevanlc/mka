name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, docs, and MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --locked
      - name: Install MSRV
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - name: Check MSRV
        run: cargo +1.98.0 check --all-targets --locked

  mainstream:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c6702eacb5b86c67cc1f5b92f3c9e322e1a687b7 # nextest
      - name: Test
        run: cargo +stable nextest run --locked
        env:
          MKA_EXPECT_NATIVE_MOVE: '1'

  freebsd:
    name: Test on FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '15.1'
            native: '1'
          - release: '15.0'
            native: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run in FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: ${{ matrix.release }}
          copyback: false
          prepare: |
            set -eu
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain 1.98.0 --no-modify-path
          run: |
            export PATH="$HOME/.cargo/bin:$PATH"
            export MKA_EXPECT_NATIVE_MOVE='${{ matrix.native }}'
            cargo test --all-targets --locked

  netbsd:
    name: Test on NetBSD 11.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run in NetBSD
        uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7 # v1.4.9
        with:
          release: "11.0"
          copyback: false
          prepare: /usr/sbin/pkg_add rust
          run: |
            export PATH="/usr/pkg/bin:$PATH"
            export MKA_EXPECT_NATIVE_MOVE='0'
            cargo test --all-targets --locked

  openbsd:
    name: Test on OpenBSD 7.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run in OpenBSD
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: "7.9"
          copyback: false
          prepare: pkg_add rust
          run: |
            export PATH="/usr/local/bin:$PATH"
            export MKA_EXPECT_NATIVE_MOVE='0'
            cargo test --all-targets --locked
